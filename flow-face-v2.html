<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow face v2</title>
<style>
  :root { --bg:#02060f; --ink:#5ee7ff; --dim:#1b4a5c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: #cfefff; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; align-content: center; gap: 14px; padding: 16px; }
  #face { width: min(94vw, 62vh, 620px); aspect-ratio: 1; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--dim); border-radius: 999px; padding: 8px 16px; font: inherit; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--ink); outline: none; }
  #log { max-width: 420px; min-height: 2.6em; text-align: center; opacity: .8; }
</style>
</head>
<body>

<!-- 1) Put this where the face should appear (give it a width; it stays square) -->
<div id="face"></div>

<div class="row">
  <button data-s="idle">Idle</button>
  <button data-s="thinking">Thinking</button>
  <button data-s="speaking">Speaking</button>
  <button id="demo">Demo reply</button>
  <button id="say">Speak aloud</button>
</div>
<div id="log"></div>

<script>
/* ============ 2) FlowFace: copy this block into your Flow page ============ */
const FlowFace = (() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function mount(host) {
    host.style.position = "relative";
    host.style.overflow = "hidden";
    if (host.getBoundingClientRect().height < 10) host.style.aspectRatio = "1";

    const cv = document.createElement("canvas");
    cv.style.cssText = "display:block;width:100%;height:100%";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", "Flow assistant face");
    const scan = document.createElement("div");
    scan.style.cssText = "position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;" +
      "background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)";
    host.append(cv, scan);
    const ctx = cv.getContext("2d");

    let W = 2, H = 2, S = 2, dpr = 1;
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      const r = host.getBoundingClientRect();
      W = Math.max(2, Math.round(r.width * dpr));
      H = Math.max(2, Math.round(r.height * dpr));
      cv.width = W; cv.height = H; S = Math.min(W, H);
    }
    new ResizeObserver(resize).observe(host);
    resize();

    /* ---- particle head: points on a squashed sphere, front of face = +z ---- */
    const N = innerWidth < 500 ? 1100 : 1700;
    const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N), ps = new Float32Array(N);
    const sxA = new Float32Array(N), syA = new Float32Array(N), szA = new Float32Array(N), bA = new Uint8Array(N);
    const gold = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * gold;
      px[i] = Math.cos(th) * r * .78; py[i] = y; pz[i] = Math.sin(th) * r * .72; ps[i] = Math.random();
    }

    /* ---- state ---- */
    let state = "idle", level = 0, shown = 0, prevShown = 0, lastPulse = 0;
    let hue = 190, thinkE = 0, speakE = 0;
    let mx = 0, my = 0, tx = 0, ty = 0, ptrAt = -1e9;
    let blinkAt = performance.now() + 2500, blinkT = -1;
    let glitchEnd = 0, nextGlitch = performance.now() + 4000;
    let lastRipple = 0;
    const ripples = [];
    const start = performance.now();
    const P = [0, 0, 1, 0];

    addEventListener("pointermove", e => {
      const r = host.getBoundingClientRect();
      tx = clamp(((e.clientX - r.left) / r.width - .5) * 2, -1.2, 1.2);
      ty = clamp(((e.clientY - r.top) / r.height - .5) * 2, -1.2, 1.2);
      ptrAt = performance.now();
    });

    function frame(now) {
      const t = (now - start) / 1000;
      const u = S / 700;
      const cx = W / 2, cy = H * .47, R = S * .33;

      /* eased values */
      thinkE += ((state === "thinking" ? 1 : 0) - thinkE) * .06;
      speakE += ((state === "speaking" ? 1 : 0) - speakE) * .08;
      const hueTarget = state === "thinking" ? 268 : state === "speaking" ? 172 : 190;
      hue += (hueTarget - hue) * .05;
      const h2 = hue + 130 * speakE;

      /* mouth loudness: real pulse() values if sent, otherwise natural-looking fake */
      let target = 0;
      if (state === "speaking") {
        target = (now - lastPulse < 200) ? level
          : Math.max(0, .35 + .3 * Math.sin(t * 11) + .2 * Math.sin(t * 17.3) + .15 * Math.sin(t * 5.1));
      }
      if (reduce && state === "speaking") target = .4;
      prevShown = shown;
      shown += (target - shown) * .35;

      /* head turn follows pointer, or wanders */
      const live = now - ptrAt < 4000;
      const gx = live ? tx : Math.sin(t * .4) * .5;
      const gy = live ? ty : Math.sin(t * .31) * .3;
      mx += (gx - mx) * .06; my += (gy - my) * .06;
      const yaw = reduce ? 0 : mx * .5 + Math.sin(t * .5) * .05;
      const pitch = reduce ? 0 : my * .25;
      const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      function proj(x, y, z) {
        const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw;
        const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
        const s = 3 / (3 - z2);
        P[0] = cx + x1 * R * s; P[1] = cy + y2 * R * s; P[2] = s; P[3] = z2;
      }

      /* fade previous frame for trails */
      ctx.globalCompositeOperation = "source-over";
      ctx.shadowBlur = 0;
      ctx.fillStyle = reduce ? "#02060f" : "rgba(2,6,15,.35)";
      ctx.fillRect(0, 0, W, H);

      /* soft core glow */
      ctx.globalCompositeOperation = "lighter";
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.7);
      bg.addColorStop(0, `hsla(${hue},100%,50%,${.07 + shown * .1})`);
      bg.addColorStop(1, `hsla(${hue},100%,50%,0)`);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      /* particles */
      for (let i = 0; i < N; i++) {
        let x = px[i], y = py[i], z = pz[i];
        if (thinkE > .01 && !reduce) {
          const a = thinkE * 1.3 * Math.sin(t * 2 + y * 4 + ps[i]);
          const c = Math.cos(a), s = Math.sin(a);
          const nx = x * c + z * s; z = -x * s + z * c; x = nx;
          const k = 1 - thinkE * .1 * (.5 + .5 * Math.sin(t * 3 + ps[i] * 6.28));
          x *= k; y *= k; z *= k;
        }
        const pu = 1 + shown * .07 + Math.sin(t * 9 + ps[i] * 40) * shown * .025 + Math.sin(t * 1.2) * .008;
        proj(x * pu, y * pu, z * pu);
        const depth = clamp((P[3] + 1) / 1.2, 0, 1);
        sxA[i] = P[0]; syA[i] = P[1];
        szA[i] = Math.max(1, (.9 + depth * 1.8) * u * P[2]);
        bA[i] = Math.min(5, (depth * 6) | 0);
      }
      for (let b = 0; b < 6; b++) {
        ctx.fillStyle = `hsla(${hue},100%,${55 + b * 5}%,${.1 + b * .13})`;
        for (let i = 0; i < N; i++) if (bA[i] === b) ctx.fillRect(sxA[i], syA[i], szA[i], szA[i]);
      }

      /* orbit rings */
      for (let k = 0; k < 3; k++) {
        const rad = R * (1.2 + .13 * k);
        const ry = rad * (.28 + .12 * Math.sin(t * .5 + k));
        const rot = reduce ? k : t * (.15 + k * .1) * (1 + thinkE * 5 + speakE) * (k % 2 ? -1 : 1);
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(rot);
        ctx.strokeStyle = `hsla(${hue},100%,65%,${.3 + speakE * .15})`;
        ctx.lineWidth = Math.max(1, dpr);
        ctx.setLineDash(k === 1 ? [2 * u, 10 * u] : [40 * u, 14 * u, 4 * u, 14 * u]);
        ctx.beginPath(); ctx.ellipse(0, 0, rad, ry, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
      ctx.setLineDash([]);

      /* thinking: scanner line sweeping over the face */
      if (thinkE > .02) {
        const sy = cy + Math.sin(t * 2.2) * R * .95;
        ctx.shadowBlur = 14 * dpr; ctx.shadowColor = `hsl(${hue},100%,60%)`;
        ctx.strokeStyle = `hsla(${hue},100%,75%,${.55 * thinkE})`;
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.moveTo(cx - R * 1.05, sy); ctx.lineTo(cx + R * 1.05, sy); ctx.stroke();
        ctx.shadowBlur = 0;
      }

      /* blink */
      if (now > blinkAt && blinkT < 0) blinkT = now;
      let blinkOpen = 1;
      if (blinkT >= 0) {
        const p = (now - blinkT) / 150;
        blinkOpen = 1 - Math.sin(Math.PI * Math.min(1, p)) * .97;
        if (p >= 1) {
          blinkT = -1;
          blinkAt = now + (Math.random() < .2 ? 220 : 2500 + Math.random() * 3500);
        }
      }

      /* eyes */
      ctx.globalCompositeOperation = "source-over";
      for (const side of [-1, 1]) {
        proj(side * .36, -.2, .72);
        const s = P[2], w = R * .16 * s;
        const open = Math.max(.05, blinkOpen * (1 - thinkE * .18) + shown * .12);
        const h = R * .085 * s * open;
        const ir = R * .075 * s;
        const scanX = thinkE * Math.sin(t * 2.3);
        const ox = clamp(mx * .9 + scanX, -1, 1) * (w - ir) * .7;
        const oy = clamp(my - thinkE * .5, -1, 1) * R * .02 * s;
        const eye = new Path2D();
        eye.moveTo(-w, 0); eye.quadraticCurveTo(0, -h * 2, w, 0); eye.quadraticCurveTo(0, h * 2, -w, 0); eye.closePath();

        ctx.save();
        ctx.translate(P[0], P[1]); ctx.rotate(-side * .12);
        ctx.fillStyle = "rgba(2,6,15,.92)"; ctx.fill(eye);
        ctx.save();
        ctx.clip(eye);
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, ir);
        g.addColorStop(0, `hsla(${hue},100%,85%,1)`);
        g.addColorStop(.5, `hsla(${hue},100%,60%,.9)`);
        g.addColorStop(1, `hsla(${hue},100%,40%,.35)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ox, oy, ir, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#02060f";
        ctx.beginPath(); ctx.arc(ox, oy, ir * (.38 - shown * .08), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.beginPath(); ctx.arc(ox - ir * .3, oy - ir * .3, ir * .14, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.shadowBlur = 18 * dpr * (1 + shown); ctx.shadowColor = `hsl(${hue},100%,60%)`;
        ctx.strokeStyle = `hsla(${hue},100%,75%,.95)`; ctx.lineWidth = 2.2 * dpr;
        ctx.stroke(eye);
        ctx.restore();
        ctx.shadowBlur = 0;
      }

      /* mouth: smile at rest, waveform when speaking */
      proj(0, .45, .66);
      const my0 = P[1], mcx = P[0], mw = R * .36 * P[2];
      const smileK = R * .045 * (1 - shown) * (1 - thinkE * .7);
      const M = 48, top = [], bot = [];
      for (let j = 0; j <= M; j++) {
        const q = j / M, env = Math.pow(Math.sin(Math.PI * q), 1.2);
        const wave = shown * R * .13 * env * (.55 + .45 * Math.sin(q * 18 + t * 22 * (.5 + shown)));
        const tw = thinkE * R * .012 * env * Math.sin(q * 30 + t * 9);
        const yc = my0 + smileK * (1 - 4 * (q - .5) * (q - .5));
        const xx = mcx + (q - .5) * 2 * mw;
        top.push([xx, yc - wave - tw]); bot.push([xx, yc + wave * 1.15 + tw]);
      }
      ctx.beginPath();
      top.forEach((p, j) => j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      for (let j = M; j >= 0; j--) ctx.lineTo(bot[j][0], bot[j][1]);
      ctx.closePath();
      ctx.fillStyle = `hsla(${h2},100%,60%,${.14 + shown * .22})`; ctx.fill();
      ctx.shadowBlur = 16 * dpr; ctx.shadowColor = `hsl(${h2},100%,60%)`;
      ctx.strokeStyle = `hsla(${h2},100%,75%,.95)`; ctx.lineWidth = 2.2 * dpr;
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.stroke();
      ctx.shadowBlur = 0;

      /* ripples from the mouth on each beat */
      if (!reduce && state === "speaking" && shown > prevShown + .07 && now - lastRipple > 140) {
        ripples.push({ x: mcx, y: my0, r: 0, a: 1 }); lastRipple = now;
      }
      ctx.globalCompositeOperation = "lighter";
      for (let k = ripples.length - 1; k >= 0; k--) {
        const rp = ripples[k];
        rp.r += S * .0045; rp.a -= .018;
        if (rp.a <= 0) { ripples.splice(k, 1); continue; }
        ctx.strokeStyle = `hsla(${h2},100%,70%,${rp.a * .5})`;
        ctx.lineWidth = 1.5 * dpr;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
      }

      /* HUD: corner brackets and state label */
      ctx.globalCompositeOperation = "source-over";
      const m = S * .04, len = S * .06;
      ctx.strokeStyle = `hsla(${hue},100%,70%,.5)`; ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(m, m + len); ctx.lineTo(m, m); ctx.lineTo(m + len, m);
      ctx.moveTo(W - m - len, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + len);
      ctx.moveTo(m, H - m - len); ctx.lineTo(m, H - m); ctx.lineTo(m + len, H - m);
      ctx.moveTo(W - m - len, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - len);
      ctx.stroke();
      ctx.font = `${Math.round(S * .024)}px ui-monospace, Menlo, monospace`;
      ctx.textAlign = "center"; ctx.fillStyle = `hsla(${hue},100%,75%,.8)`;
      if ("letterSpacing" in ctx) ctx.letterSpacing = (S * .006) + "px";
      ctx.fillText(state === "idle" ? "standby" : state, cx, H - m * 1.5);

      /* glitch slices: on state change and now and then */
      if (!reduce) {
        if (now > nextGlitch) { glitchEnd = now + 160; nextGlitch = now + 3500 + Math.random() * 4500; }
        if (now < glitchEnd) {
          for (let k = 0; k < 3; k++) {
            const sy = Math.random() * H * .8, sh = H * (.02 + Math.random() * .06);
            const dx = (Math.random() - .5) * S * .06;
            ctx.drawImage(cv, 0, sy, W, sh, dx, sy, W, sh);
          }
        }
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    return {
      /* "idle" | "thinking" | "speaking" */
      setState(s) {
        if (s !== state) { state = s; glitchEnd = performance.now() + 240; }
        if (s !== "speaking") level = 0;
      },
      /* optional: 0..1 loudness, for real lip movement from audio or speech events */
      pulse(v) { level = clamp(v, 0, 1); lastPulse = performance.now(); },
    };
  }
  return { mount };
})();
/* ====================== end of FlowFace block ====================== */

/* ---------- demo wiring (not needed in Flow) ---------- */
const face = FlowFace.mount(document.getElementById("face"));
const log = document.getElementById("log");
document.querySelectorAll("[data-s]").forEach(b =>
  b.addEventListener("click", () => face.setState(b.dataset.s)));

document.getElementById("demo").addEventListener("click", async () => {
  const words = "Hello Athul, I am Flow. Here is a reply that streams in word by word.".split(" ");
  log.textContent = "";
  face.setState("thinking");                 // request sent, waiting for the reply
  await new Promise(r => setTimeout(r, 1600));
  face.setState("speaking");                 // reply started
  for (const w of words) {
    log.textContent += w + " ";
    await new Promise(r => setTimeout(r, 240));
  }
  face.setState("idle");                     // reply finished
});

document.getElementById("say").addEventListener("click", () => {
  if (!("speechSynthesis" in window)) { log.textContent = "This browser has no speech synthesis."; return; }
  const text = "Hi, I am Flow. This is my face, moving while I talk.";
  log.textContent = text;
  const ut = new SpeechSynthesisUtterance(text);
  ut.onstart = () => face.setState("speaking");
  ut.onboundary = () => face.pulse(.4 + Math.random() * .6);   // beat on every word
  ut.onend = ut.onerror = () => face.setState("idle");
  speechSynthesis.cancel();
  face.setState("thinking");
  setTimeout(() => speechSynthesis.speak(ut), 900);
});
</script>
</body>
</html>
